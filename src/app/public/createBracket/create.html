<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <title>Finish.GG</title>
    <link rel="stylesheet" type="text/css" href="create.css">

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/brackets-viewer@latest/dist/brackets-viewer.min.css" />
    <script
        type="text/javascript"
        src="https://cdn.jsdelivr.net/npm/brackets-viewer@latest/dist/brackets-viewer.min.js">
    </script>

</head>

<body>

    <h1>Finish.GG</h1>

    <p>Create Bracket</p>


    <div class="form">
        <div class="formInputs">
            <label for="stage">Stage Name:</label>
            <input id="stage" type="text" name="stage">

            <label for="numPpl">Number of Participants:</label>
            <input id="numPpl" type="text" name="numPpl">
            
            <label for="format">Genre:</label>
                <select id="format" name="format">
                    <option value="doubleE">Double Elimination</option>
                    <option value="singleE">Single Elimination</option>
                    <option value="roundR">Round Robin</option>
                </select>
        </div>


        <button id="submit">Submit</button>
    </div>

    <div id="bracketsContainer" class="brackets-viewer"></div>

    <div id="message"></div>

    <script src="register.js"></script>

</body>

</html>
